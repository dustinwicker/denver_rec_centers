name: Weekly Schedule Scrape

on:
  # 6:00 AM America/Denver on Sunday, Monday, Wednesday, and Friday.
  # Thursday is not a scrape day. GitHub's scheduler can still start this
  # hours late; the timezone only keeps 6:00 AM correct across daylight time.
  schedule:
    - cron: '0 6 * * 0,1,3,5'
      timezone: America/Denver
  
  # Allow manual trigger from GitHub Actions UI.
  # reason=missed-schedule is the 7:10 AM makeup run.
  workflow_dispatch:
    inputs:
      reason:
        description: manual, or missed-schedule when the 6:00 AM run was never created
        default: manual
        required: false

permissions:
  contents: write
  actions: read

# A late scheduled run waits, then stops, if the makeup run already did the scrape.
concurrency:
  group: weekly-scrape
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip when a run was already created this morning
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.reason }}
        run: python .github/schedule_guard.py gate --workflow weekly-scrape.yml --hour 6 --minute 0

  scrape:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager
      
      - name: Run scraper
        run: |
          cd src
          python scrape_schedule.py --current-only
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Sync with remote BEFORE committing to ensure we start from latest state.
          # This prevents "rejected (fetch first)" errors by making sure our local
          # branch matches the remote before we create our commit.
          git fetch origin main
          git stash push data/ || true  # Temporarily save scraped files
          git reset --hard origin/main  # Match remote exactly
          git stash pop || true         # Reapply our scraped files
          
          # Commit our changes on top of the latest remote state
          git add data/*.json
          git commit -m "Schedule update: $(date +%Y-%m-%d)"
          
          # Sync AGAIN before pushing to handle race conditions where the remote
          # might have been updated between our commit and push (e.g., if another
          # workflow run started simultaneously). Rebase moves our commit on top
          # of any new remote commits.
          git fetch origin main
          git rebase origin/main
          
          # Push the rebased commit
          git push origin main
