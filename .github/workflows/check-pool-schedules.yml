name: Check Pool Schedules

on:
  # 6:10 AM Denver time, every day. A center is fetched once its poster is
  # inside ten business days of a printed end date, or immediately once that
  # date has passed. Posters with no printed end date, Glenarm, and any pool
  # marked closed are fetched every day.
  schedule:
    - cron: '10 6 * * *'
      timezone: America/Denver
  workflow_dispatch:
    inputs:
      reason:
        description: manual, or missed-schedule when the 6:10 AM run was never created
        default: manual
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: pool-schedules
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip when a run was already created this morning
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.reason }}
        run: python .github/schedule_guard.py gate --workflow check-pool-schedules.yml --hour 6 --minute 10

  check:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read pool canvases that are due
        run: python src/check_pool_schedules.py

      - name: Check for a schedule change
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain -- data/pool_schedules.json data/pool_schedule_pending.json)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push a schedule update
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          stash_paths=()
          if [ -f data/pool_schedules.json ]; then
            stash_paths+=(data/pool_schedules.json)
          fi
          if [ -f data/pool_schedule_pending.json ]; then
            stash_paths+=(data/pool_schedule_pending.json)
          fi
          if [ ${#stash_paths[@]} -gt 0 ]; then
            git stash push -- "${stash_paths[@]}"
          fi
          git reset --hard origin/main
          git stash pop
          git add data/pool_schedules.json
          if [ -f data/pool_schedule_pending.json ]; then
            git add data/pool_schedule_pending.json
          elif git ls-files --error-unmatch data/pool_schedule_pending.json >/dev/null 2>&1; then
            git rm -f data/pool_schedule_pending.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Pool schedule update: $(date +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push origin main
